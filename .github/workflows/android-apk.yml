name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Compile and check
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/zuolemei-0.1.0-test.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zuolemei-android-apk
          path: android-app/output/
          retention-days: 14
          if-no-files-found: error
      - name: Download instructions
        run: |
          echo '### 安卓测试安装包' >> "$GITHUB_STEP_SUMMARY"
          echo '下载本次运行的 zuolemei-android-apk 附件，解压后将 APK 发送到安卓手机安装。' >> "$GITHUB_STEP_SUMMARY"
          echo '这是测试版；锁屏、重启、省电模式须真机验证。未配置固定签名时，下次构建可能需要卸载旧版（会清除记录）。' >> "$GITHUB_STEP_SUMMARY"

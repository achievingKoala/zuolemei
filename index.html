<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提醒闹钟 - 极简声音唤醒工具</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cg fill='none' stroke='%23ff4757' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='32' cy='35' r='19'/%3E%3Cpath d='M32 24v12l8 5M12 16l8-6M44 10l8 6M20 52l-5 6M44 52l5 6'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    /* 采用 levelsio 标志性的极客极简黑白高对比度风格 */
    :root {
      --bg: #111111;
      --card-bg: #1a1a1a;
      --border: #333333;
      --text: #ffffff;
      --text-dim: #888888;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-time {
      padding: 10px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-time.active, .btn-time:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .sound-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .repeat-option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #000;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .repeat-option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-preview {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-preview:hover {
      color: #fff;
      border-color: #fff;
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-start:hover {
      background: var(--accent-hover);
    }

    /* Active Tasks List UI */
    .active-tasks-section {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .completed-date-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .completed-date-nav input {
      width: auto;
      min-width: 0;
      flex: 1;
      color-scheme: dark;
    }

    .task-card {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-snooze {
      background: #222;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-snooze:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .task-meta {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .repeat-badge {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .task-time-remaining {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: var(--accent);
    }

    /* Monetization Hook */
    .pro-banner {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .pro-link {
      color: #ffb142;
      text-decoration: none;
      font-weight: 600;
    }

    .pro-link:hover {
      text-decoration: underline;
    }
    .btn-housework {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: rgba(255, 71, 87, .08);
      color: var(--accent-hover);
      font: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btn-housework:hover { background: rgba(255, 71, 87, .16); border-color: var(--accent-hover); }
    .btn-housework:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 3px; }
    .housework-badge {
      display: inline-block;
      margin-right: 8px;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(59,130,246,.15);
      color: #93c5fd;
      font-size: .72rem;
      font-weight: 500;
      vertical-align: middle;
    }
    .task-actions.reminder-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      grid-template-rows: auto auto;
      gap: 8px;
      align-items: center;
      border-top: 1px solid #222;
      padding-top: 8px;
    }
    .reminder-actions-label { grid-column: 1; grid-row: 1; font-size: .75rem; color: var(--text-dim); }
    .reminder-edit { grid-column: 2; grid-row: 1; }
    .reminder-plus5 { grid-column: 3; grid-row: 1; }
    .reminder-plus15 { grid-column: 4; grid-row: 1; }
    .reminder-complete { grid-column: 5; grid-row: 1; }
    .reminder-minus5 { grid-column: 3; grid-row: 2; }
    .reminder-minus15 { grid-column: 4; grid-row: 2; }
    @media (max-width: 480px) {
      .task-actions.reminder-actions { grid-template-columns: 0 repeat(4, minmax(0, 1fr)); gap: 6px; }
      .reminder-actions-label { display: none; }
      .task-actions.reminder-actions .btn-snooze { padding: 8px 3px; font-size: .75rem; white-space: nowrap; }
    }
    .btn-housework-blue { color:#93c5fd; border-color:#3b82f6; background:rgba(59,130,246,.09); }
    .btn-housework-blue:hover { background:rgba(59,130,246,.18); border-color:#60a5fa; }
    .btn-housework-blue:focus-visible { outline-color:#60a5fa; }
    .btn-sleep-purple { color:#c4b5fd; border-color:#a78bfa; background:rgba(167,139,250,.09); }
    .btn-sleep-purple:hover { background:rgba(167,139,250,.18); border-color:#c4b5fd; }
    .btn-sleep-purple:focus-visible { outline-color:#c4b5fd; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📢 提醒闹钟</h1>
      <p class="subtitle">只用声音，强行唤醒你的执行力</p>
    </header>

    <dialog id="edit-reminder-dialog" style="background:var(--bg-color, #181818);color:inherit;border:1px solid #555;border-radius:16px;padding:24px;position:fixed;inset:0;margin:auto;width:380px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;">
      <form onsubmit="saveReminderTime(event)">
        <h2 id="edit-reminder-title" style="font-size:1.1rem;">修改提醒时间</h2>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;">
          <button type="button" class="btn-snooze" onclick="remindAfterMinutes(15)">15分钟后提醒</button>
          <button type="button" class="btn-snooze" onclick="remindAfterMinutes(5)">5分钟后提醒</button>
        </div>
        <label for="edit-reminder-time">提醒日期和时间</label>
        <input id="edit-reminder-time" type="datetime-local" required style="display:block;margin:16px 0;color-scheme:dark;">
        <p id="edit-reminder-error" role="alert" style="color:#ff6b6b;"></p>
        <button type="button" class="btn-snooze" onclick="document.getElementById('edit-reminder-dialog').close()">取消</button>
        <button type="submit" class="btn-snooze">保存时间</button>
      </form>
    </dialog>
    <dialog id="housework-dialog" aria-labelledby="housework-heading" style="background:var(--bg-color, #181818);color:inherit;border:1px solid #555;border-radius:16px;padding:24px;position:fixed;inset:0;margin:auto;width:380px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
        <h2 id="housework-heading" style="font-size:1.1rem;">批量添加家务</h2>
        <button type="button" class="btn-delete" aria-label="关闭" onclick="document.getElementById('housework-dialog').close()">×</button>
      </div>
      <div style="padding-top:8px;">
      <div style="display:grid;gap:14px;margin:16px 0;">
        <label style="display:flex;align-items:center;gap:12px;"><input type="checkbox" checked name="housework" value="洗碗" data-time="dish-time">洗碗 <input id="dish-time" type="time" value="19:30" aria-label="洗碗提醒时间" style="margin-left:auto;color-scheme:dark;"></label>
        <label style="display:flex;align-items:center;gap:12px;"><input type="checkbox" checked name="housework" value="洗衣服" data-time="laundry-time">洗衣服 <input id="laundry-time" type="time" value="20:00" aria-label="洗衣服提醒时间" style="margin-left:auto;color-scheme:dark;"></label>
        <label style="display:flex;align-items:center;gap:12px;"><input type="checkbox" checked name="housework" value="倒垃圾" data-time="trash-time">倒垃圾 <input id="trash-time" type="time" value="20:30" aria-label="倒垃圾提醒时间" style="margin-left:auto;color-scheme:dark;"></label>
      </div>
      <button type="button" class="btn-start" onclick="addHousework()">添加选中的家务提醒</button>
      <p id="housework-status" role="status" style="color:var(--text-dim);font-size:.85rem;margin-top:12px;"></p>
      </div>
    </dialog>
    <dialog id="sleep-dialog" aria-labelledby="sleep-heading" style="background:var(--bg);color:var(--text);border:1px solid #555;border-radius:16px;padding:24px;position:fixed;inset:0;margin:auto;width:380px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px);overflow:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;">
        <h2 id="sleep-heading" style="font-size:1.1rem;">早睡清单</h2>
        <button type="button" class="btn-delete" aria-label="关闭" onclick="document.getElementById('sleep-dialog').close()">×</button>
      </div>
      <label for="sleep-target" style="display:flex;align-items:center;justify-content:space-between;margin:20px 0;">目标睡眠时间 <input id="sleep-target" type="time" value="23:00" onchange="renderSleepPlan()" style="color-scheme:dark;"></label>
      <div id="sleep-plan" style="display:grid;gap:16px;"></div>
      <p id="sleep-status" role="status" style="font-size:.85rem;color:var(--text-dim);margin-top:16px;"></p>
      <button type="button" class="btn-start" onclick="addSleepPlan()">添加选中的早睡提醒</button>
    </dialog>

    <!-- 设置表单 -->
    <div id="setup-form">
      <div class="form-group">
        <label for="task-input">提醒事项</label>
        <input type="text" id="task-input" list="completed-task-options" autocomplete="off" placeholder="输入新事项，或选择已做过的事项">
        <datalist id="completed-task-options"></datalist>

      </div>

      <div class="form-group">
        <label>多久后提醒？</label>
        <div class="time-options">
          <button class="btn-time" onclick="selectTime(0.05, this)">3秒（测试）</button>
          <button class="btn-time active" onclick="selectTime(5, this)">5分钟</button>
          <button class="btn-time" onclick="selectTime(10, this)">10分钟</button>
          <button class="btn-time" onclick="selectTime(15, this)">15分钟</button>
          <button class="btn-time" onclick="selectTime(25, this)">25分钟</button>
          <button class="btn-time" onclick="selectTime(45, this)">45分钟</button>
        </div>
      </div>

      <div class="form-group">
        <label>提醒声音</label>
        <div class="sound-badge">
          <div class="sound-info">
            <span>🚨</span>
            <strong>高穿透脉冲警报（最长响铃5分钟）</strong>
          </div>
          <button class="btn-preview" onclick="playSignatureSound()">试听</button>
          <button class="btn-preview" onclick="stopAlarm()">停止铃声</button>
        </div>
      </div>

      <p id="sound-status" role="status" style="font-size:0.85rem; color:var(--text-dim);">到期后循环播放脉冲警报，最长5分钟；可随时停止。</p>
      <button class="btn-start" onclick="addTask()">添加声音提醒</button>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">
      <button type="button" class="btn-housework btn-housework-blue" onclick="document.getElementById('housework-status').textContent = ''; document.querySelectorAll('[name=housework]').forEach(item => item.checked = true); document.getElementById('housework-dialog').showModal();">批量添加家务</button>
      <button type="button" class="btn-housework btn-sleep-purple" onclick="openSleepPlan()">添加早睡清单</button>
      </div>
    </div>

    <!-- 运行中的多任务列表 UI -->
    <div class="active-tasks-section">
      <div class="section-title">进行中的提醒 (<span id="task-count">0</span>)</div>
      <div id="tasks-list">
        <!-- 任务卡片会动态插入到这里 -->
      </div>
    </div>

    <section class="active-tasks-section" aria-labelledby="completed-heading">
      <h2 class="section-title" id="completed-heading">已完成记录 (<span id="completed-count">0</span>)</h2>
      <div class="completed-date-nav">
        <button type="button" class="btn-snooze" onclick="changeCompletedDate(-1)" aria-label="查看前一天">前一天</button>
        <input type="date" id="completed-date" aria-label="查看哪一天的已完成记录" onchange="renderCompletedTasks()">
        <button type="button" class="btn-snooze" onclick="changeCompletedDate(1)" aria-label="查看后一天">后一天</button>
        <button type="button" class="btn-snooze" onclick="showCompletedToday()">今天</button>
      </div>
      <div id="completed-list"></div>
    </section>

    <section class="active-tasks-section" aria-labelledby="activity-heading">
      <h2 class="section-title" id="activity-heading">提醒时的记录 (<span id="activity-count">0</span>)</h2>
      <div id="activity-list"></div>
    </section>

    <!-- 追问与声音提示弹窗 -->
    <div id="snooze-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; justify-content:center; align-items:center; padding:20px;">
      <div style="background:var(--card-bg); border:1px solid var(--accent); border-radius:12px; padding:24px; max-width:400px; width:100%; text-align:center;">
        <h2 style="font-size:1.3rem; margin-bottom:8px;" id="modal-task-title">时间到了！</h2>
        <p style="color:var(--text-dim); font-size:0.9rem; margin-bottom:20px;" id="modal-task-sub">完成了吗？或者选择稍后提醒：</p>
        
        <div class="form-group" style="text-align:left;">
          <label for="current-activity">你现在正在做什么？</label>
          <input type="text" id="current-activity" placeholder="例如：刷手机 / 写报告 / 吃饭" maxlength="500">
          <p style="color:var(--text-dim); font-size:0.8rem; margin-top:8px;">点击完成或稍后提醒时保存，可留空。</p>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px;">
          <button class="btn-time" onclick="snoozeActiveTask(5)">+5分钟</button>
          <button class="btn-time" onclick="snoozeActiveTask(10)">+10分钟</button>
          <button class="btn-time" onclick="snoozeActiveTask(15)">+15分钟</button>
        </div>

        <button class="btn-start" onclick="completeActiveTask()" style="background:#2ed573;">完成了！(关闭)</button>
      </div>
    </div>

    <!-- levelsio 式变现/打赏入口 -->
    <div class="pro-banner" style="display: none;">
      <span>想要暴躁老哥语音或 AI 语音定制？</span>
      <a href="#" class="pro-link" onclick="alert('即将推出 Pro 版 ($3/月)！包括 AI 语音喊话、自定义音频上传等功能。'); return false;">解锁 Pro ⚡</a>
    </div>
  </div>

  <script>
    let selectedMinutes = 5;
    let tasks = JSON.parse(localStorage.getItem('bark_tasks') || '[]');
    let completedTasks = JSON.parse(localStorage.getItem('bark_completed_tasks') || '[]');
    let activityRecords = JSON.parse(localStorage.getItem('bark_activity_records') || '[]');
    let globalTicker = null;
    let currentRingingTaskId = null;

    const notificationWorker = 'serviceWorker' in navigator
      ? navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).catch(error => {
          console.error('Notification worker unavailable:', error);
          return null;
        })
      : Promise.resolve(null);

    const fallbackNotifications = new Map();

    async function clearTaskNotification(id) {
      fallbackNotifications.get(id)?.close();
      fallbackNotifications.delete(id);
      const registration = await notificationWorker;
      if (registration) {
        for (const notification of await registration.getNotifications({ tag: id })) notification.close();
      }
    }

    function resolveRinging(task) {
      delete task.ringingToken;
      void clearTaskNotification(task.id).catch(console.error);
    }

    function recordSnooze(task, minutes) {
      task.snoozeCount = (Number(task.snoozeCount) || 0) + 1;
      task.snoozeMinutes = (Number(task.snoozeMinutes) || 0) + minutes;
    }

    function handleNotificationAction(taskId, action, actionTime = Date.now(), token) {
      const task = tasks.find(item => item.id === taskId);
      if (!task || !token || task.ringingToken !== token) return;
      if (action === 'complete') {
        completeTask(taskId, actionTime);
      } else if (action === 'snooze' || action === 'snooze10') {
        const minutes = action === 'snooze10' ? 10 : 5;
        resolveRinging(task);
        recordSnooze(task, minutes);
        recordCurrentActivity(task, `稍后提醒（${minutes}分钟）`, actionTime);
        task.targetTime = actionTime + minutes * 60 * 1000;
        if (currentRingingTaskId === taskId) closeModal();
        saveTasks();
        renderTasks();
      } else {
        if (currentRingingTaskId && currentRingingTaskId !== taskId) return;
        currentRingingTaskId = taskId;
        document.getElementById('modal-task-title').innerText = `📢 ${task.title}`;
        document.getElementById('modal-task-sub').innerText = '提醒时间到！打算完成了还是再推迟一会儿？';
        if (document.getElementById('snooze-modal').style.display !== 'flex') document.getElementById('current-activity').value = '';
        document.getElementById('snooze-modal').style.display = 'flex';
        document.querySelector('#snooze-modal button').focus();
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data?.type !== 'notification-action') return;
        handleNotificationAction(event.data.taskId, event.data.action, event.data.time, event.data.token);
      });
    }

    async function showTaskNotification(task) {
      if (!window.Notification || Notification.permission !== 'granted') return;
      const token = task.ringingToken;
      const body = `${task.title}\n已延长 ${Number(task.snoozeCount) || 0} 次，累计 ${Number(task.snoozeMinutes) || 0} 分钟`;
      const registration = await notificationWorker;
      if (!JSON.parse(localStorage.getItem('bark_tasks') || '[]').some(t => t.id === task.id && t.ringingToken === token)) return;
      if (registration) {
        try {
          await registration.showNotification('📢 提醒闹钟 时间到！', {
            body,
            tag: task.id,
            data: { taskId: task.id, token, url: window.location.href.split('?')[0] },
            actions: [
              { action: 'complete', title: '完成了' },
              { action: 'snooze10', title: '10分钟后提醒' },
              { action: 'snooze', title: '5分钟后提醒' }
            ]
          });
          if (!JSON.parse(localStorage.getItem('bark_tasks') || '[]').some(t => t.id === task.id && t.ringingToken === token)) await clearTaskNotification(task.id);
          return;
        } catch (error) {
          console.error('Notification actions unavailable:', error);
        }
      }
      try {
        const notification = new Notification('📢 提醒闹钟 时间到！', { body });
        fallbackNotifications.set(task.id, notification);
        notification.onclick = () => {
          window.focus();
          notification.close();
          handleNotificationAction(task.id, 'open', Date.now(), token);
        };
      } catch (error) {
        console.error('Notification unavailable:', error);
      }
    }

    // 选择预设时间
    function selectTime(mins, btnElement) {
      selectedMinutes = mins;
      document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }

    let alarmContext = null;
    let alarmPulseTimer = null;
    let alarmStopTimer = null;

    function stopAlarm() {
      clearInterval(alarmPulseTimer);
      clearTimeout(alarmStopTimer);
      alarmPulseTimer = null;
      alarmStopTimer = null;
      if (alarmContext) {
        alarmContext.close().catch(console.error);
        alarmContext = null;
      }
    }

    function playSignatureSound() {
      stopAlarm();
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        alarmContext = ctx;
        const playPulse = () => {
          [0, 0.2, 0.4].forEach(delay => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, ctx.currentTime + delay);
            osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + delay + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.15);
          });
        };
        playPulse();
        alarmPulseTimer = setInterval(playPulse, 1000);
        alarmStopTimer = setTimeout(stopAlarm, 5 * 60 * 1000);
      } catch (error) {
        stopAlarm();
        console.error('Alarm playback error:', error);
        document.getElementById('sound-status').textContent = '声音播放失败，请点击试听并检查浏览器声音权限。';
      }
    }

    const sleepSteps = [
      {title: '记录明天要做的事', offset: 45},
      {title: '洗漱刷牙', offset: 30},
      {title: '收拾床', offset: 10},
      {title: '关灯睡觉', offset: 0}
    ];
    let sleepSelection = [true, true, true, true];
    function getSleepPlan() {
      const value = document.getElementById('sleep-target').value;
      if (!/^\d{2}:\d{2}$/.test(value)) return [];
      const [hour, minute] = value.split(':').map(Number);
      const target = new Date();
      target.setHours(hour, minute, 0, 0);
      if (target.getTime() <= Date.now()) target.setDate(target.getDate() + 1);
      return sleepSteps.map(step => ({...step, targetTime: target.getTime() - step.offset * 60000}));
    }
    function openSleepPlan() {
      document.getElementById('sleep-status').textContent = '';
      renderSleepPlan();
      document.getElementById('sleep-dialog').showModal();
    }
    function renderSleepPlan() {
      const container = document.getElementById('sleep-plan');
      container.replaceChildren();
      getSleepPlan().forEach((step, index) => {
        const label = document.createElement('label');
        label.style.cssText = 'display:flex;align-items:center;gap:10px;';
        const check = document.createElement('input');
        check.type = 'checkbox'; check.checked = sleepSelection[index];
        check.onchange = () => { sleepSelection[index] = check.checked; };
        const title = document.createElement('span'); title.textContent = step.title;
        const time = document.createElement('span');
        time.style.cssText = 'margin-left:auto;color:var(--text-dim);white-space:nowrap;';
        time.textContent = new Date(step.targetTime).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false});
        label.append(check, title, time); container.append(label);
      });
    }
    function addSleepPlan() {
      const plan = getSleepPlan().filter((step, index) => sleepSelection[index]);
      const status = document.getElementById('sleep-status');
      if (!plan.length) { status.textContent = '请选择事项并设置目标睡眠时间。'; return; }
      if (plan.some(step => step.targetTime <= Date.now())) {
        status.textContent = '部分准备时间已过，请取消勾选这些事项，或将目标睡眠时间调晚。'; return;
      }
      plan.forEach(step => {
        if (tasks.some(t => t.category === 'sleep' && t.title === step.title && t.targetTime === step.targetTime)) return;
        tasks.push({id: 'task_' + crypto.randomUUID(), title: step.title, category: 'sleep', targetTime: step.targetTime, minutes: (step.targetTime - Date.now()) / 60000, isRepeat: false, snoozeCount: 0, snoozeMinutes: 0});
      });
      saveTasks(); renderTasks();
      document.getElementById('sleep-dialog').close();
      if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
    }

    function addHousework() {
      const selected = [...document.querySelectorAll('[name="housework"]:checked')];
      const status = document.getElementById('housework-status');
      if (!selected.length) { status.textContent = '请先勾选要添加的家务。'; return; }
      const now = Date.now();
      const pending = [];
      for (const item of selected) {
        const value = document.getElementById(item.dataset.time).value;
        if (!/^\d{2}:\d{2}$/.test(value)) { status.textContent = '请设置' + item.value + '的提醒时间。'; return; }
        const [hours, minutes] = value.split(':').map(Number);
        const date = new Date(now);
        date.setHours(hours, minutes, 0, 0);
        if (date.getTime() <= now) { status.textContent = item.value + '的时间已过，请选择晚于现在的时间。'; return; }
        pending.push({item, targetTime: date.getTime()});
      }
      let added = 0;
      for (const {item, targetTime} of pending) {
        if (tasks.some(t => t.title === item.value && new Date(t.targetTime).toDateString() === new Date(now).toDateString())) continue;
        tasks.push({id: 'task_' + crypto.randomUUID(), title: item.value, category: 'housework', minutes: (targetTime - now) / 60000, isRepeat: false, snoozeCount: 0, snoozeMinutes: 0, targetTime});
        added++;
      }
      saveTasks();
      renderTasks();
      selected.forEach(item => item.checked = false);
      document.getElementById('housework-dialog').close();
      status.textContent = `已添加 ${added} 项家务提醒。` + (added < pending.length ? '已有的家务提醒已跳过。' : '');
      if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
    }

    // 添加新任务
    function addTask() {
      const input = document.getElementById('task-input');
      const title = input.value.trim() || '未命名提醒';

      const newTask = {
        id: 'task_' + Date.now(),
        title: title,
        minutes: selectedMinutes,
        isRepeat: false,
        snoozeCount: 0,
        snoozeMinutes: 0,
        targetTime: Date.now() + selectedMinutes * 60 * 1000
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();

      // 请求系统通知权限
      if (window.Notification && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    let editingReminderId = null;
    function editReminderTime(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      editingReminderId = id;
      const date = new Date(task.targetTime);
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      document.getElementById('edit-reminder-time').value = local.toISOString().slice(0, 16);
      document.getElementById('edit-reminder-error').textContent = '';
      document.getElementById('edit-reminder-title').textContent = '修改提醒时间：' + task.title;
      document.getElementById('edit-reminder-dialog').showModal();
    }
    function remindAfterMinutes(minutes) {
      const task = tasks.find(t => t.id === editingReminderId);
      if (task) {
        resolveRinging(task);
        if (currentRingingTaskId === task.id) closeModal();
        task.targetTime = Date.now() + minutes * 60 * 1000;
        saveTasks();
        renderTasks();
      }
      document.getElementById('edit-reminder-dialog').close();
    }
    function saveReminderTime(event) {
      event.preventDefault();
      const targetTime = new Date(document.getElementById('edit-reminder-time').value).getTime();
      if (!Number.isFinite(targetTime) || targetTime <= Date.now()) {
        document.getElementById('edit-reminder-error').textContent = '请选择晚于现在的提醒时间。';
        return;
      }
      const task = tasks.find(t => t.id === editingReminderId);
      if (task) {
        resolveRinging(task);
        if (currentRingingTaskId === task.id) closeModal();
        task.targetTime = targetTime;
        saveTasks();
        renderTasks();
      }
      document.getElementById('edit-reminder-dialog').close();
    }

    function advanceTaskTime(id, minutes) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      resolveRinging(task);
      if (currentRingingTaskId === id) closeModal();
      task.targetTime -= minutes * 60 * 1000;
      saveTasks();
      renderTasks();
    }

    // 快捷稍后提醒 (从卡片直接推迟)
    function snoozeTaskDirect(id, extraMinutes, fromScheduledTime = false) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        resolveRinging(task);
        recordSnooze(task, extraMinutes);
        if (currentRingingTaskId === id) {
          recordCurrentActivity(task, `稍后提醒（${extraMinutes}分钟）`);
          closeModal();
        }
        task.targetTime = (fromScheduledTime ? task.targetTime : Date.now()) + extraMinutes * 60 * 1000;
        saveTasks();
        renderTasks();
      }
    }

    // 弹窗触发稍后提醒
    function snoozeActiveTask(extraMinutes) {
      if (currentRingingTaskId) {
        snoozeTaskDirect(currentRingingTaskId, extraMinutes);
        closeModal();
      }
    }

    // 两个完成入口共用记录逻辑，取消和稍后提醒不记入历史。
    function completeTask(id, completedAt = Date.now()) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      resolveRinging(task);
      const activity = recordCurrentActivity(task, '已完成', completedAt);
      completedTasks.unshift({ title: task.title, completedAt, activity });
      localStorage.setItem('bark_completed_tasks', JSON.stringify(completedTasks));
      if (!task.isRepeat) tasks = tasks.filter(item => item.id !== id);
      if (currentRingingTaskId === id) closeModal();
      saveTasks();
      renderTasks();
      renderCompletedTasks();
    }

    function completeActiveTask() {
      if (currentRingingTaskId) completeTask(currentRingingTaskId);
    }

    function recordCurrentActivity(task, action, recordedAt = Date.now()) {
      if (currentRingingTaskId !== task.id) return '';
      const input = document.getElementById('current-activity');
      const activity = input.value.trim();
      if (!activity) return '';
      activityRecords.unshift({ title: task.title, activity, action, recordedAt });
      localStorage.setItem('bark_activity_records', JSON.stringify(activityRecords));
      input.value = '';
      renderActivityRecords();
      return activity;
    }

    function renderActivityRecords() {
      const list = document.getElementById('activity-list');
      document.getElementById('activity-count').textContent = activityRecords.length;
      list.replaceChildren();
      if (!activityRecords.length) {
        const empty = document.createElement('p');
        empty.className = 'task-meta';
        empty.textContent = '在到期弹窗中填写正在做的事，处理提醒后会保存在这里。';
        list.append(empty);
        return;
      }
      activityRecords.forEach(record => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.style.overflowWrap = 'anywhere';
        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = record.title;
        const activity = document.createElement('p');
        activity.textContent = '当时正在：' + record.activity;
        const meta = document.createElement('time');
        meta.className = 'task-meta';
        meta.dateTime = new Date(record.recordedAt).toISOString();
        meta.textContent = record.action + ' · ' + new Date(record.recordedAt).toLocaleString('zh-CN', { hour12: false });
        card.append(title, activity, meta);
        list.append(card);
      });
    }

    function renderCompletedTaskOptions() {
      const options = document.getElementById('completed-task-options');
      const titles = [...new Set(completedTasks.map(task =>
        typeof task.title === 'string' ? task.title.trim() : ''
      ).filter(Boolean))];
      options.replaceChildren();
      titles.forEach(title => {
        const option = document.createElement('option');
        option.value = title;
        option.textContent = title;
        options.append(option);
      });
    }

    function localDateKey(value) {
      const date = new Date(value);
      return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'),
        String(date.getDate()).padStart(2, '0')].join('-');
    }

    function changeCompletedDate(offset) {
      const input = document.getElementById('completed-date');
      const date = new Date((input.value || localDateKey(Date.now())) + 'T12:00:00');
      date.setDate(date.getDate() + offset);
      input.value = localDateKey(date);
      renderCompletedTasks();
    }

    function showCompletedToday() {
      document.getElementById('completed-date').value = localDateKey(Date.now());
      renderCompletedTasks();
    }

    function renderCompletedTasks() {
      renderCompletedTaskOptions();
      const list = document.getElementById('completed-list');
      const dateInput = document.getElementById('completed-date');
      if (!dateInput.value) dateInput.value = localDateKey(Date.now());
      const dailyTasks = completedTasks.filter(task => localDateKey(task.completedAt) === dateInput.value)
        .sort((a, b) => b.completedAt - a.completedAt);
      document.getElementById('completed-count').textContent = dailyTasks.length;
      list.replaceChildren();
      if (!dailyTasks.length) {
        const empty = document.createElement('p');
        empty.className = 'task-meta';
        empty.textContent = '这一天还没有已完成记录。';
        list.append(empty);
        return;
      }
      const formatter = new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      dailyTasks.forEach(task => {
        const card = document.createElement('div');
        card.className = 'task-card';
        const title = document.createElement('div');
        title.className = 'task-title';
        title.style.overflowWrap = 'anywhere';
        title.textContent = task.title;
        const time = document.createElement('time');
        time.className = 'task-meta';
        time.dateTime = new Date(task.completedAt).toISOString();
        time.textContent = '已完成 · ' + formatter.format(task.completedAt);
        card.append(title, time);
        if (task.activity) {
          const activity = document.createElement('p');
          activity.style.overflowWrap = 'anywhere';
          activity.textContent = '当时正在：' + task.activity;
          card.append(activity);
        }
        list.append(card);
      });
    }

    function closeModal() {
      stopAlarm();
      document.getElementById('snooze-modal').style.display = 'none';
      currentRingingTaskId = null;
      document.getElementById('current-activity').value = '';
    }

    // 删除任务
    function deleteTask(id) {
      void clearTaskNotification(id).catch(console.error);
      if (currentRingingTaskId === id) closeModal();
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    // 持久化存储
    function saveTasks() {
      localStorage.setItem('bark_tasks', JSON.stringify(tasks));
    }

    // 格式化剩余时间
    function formatRemainingTime(ms) {
      if (ms <= 0) return "00:00";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 渲染任务列表与轮询检查
    function renderTasks() {
      const listContainer = document.getElementById('tasks-list');
      document.getElementById('task-count').innerText = tasks.length;

      if (tasks.length === 0) {
        listContainer.innerHTML = `<p style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 12px 0;">暂无运行中的提醒，添加一个吧！</p>`;
        document.title = '提醒闹钟 - 极简声音唤醒工具';
        return;
      }

      listContainer.innerHTML = tasks.map(t => {
        const remaining = t.targetTime - Date.now();
        const isHousework = t.category === 'housework' || ['洗碗', '洗衣服', '倒垃圾'].includes(t.title);
        return `
          <div class="task-card">
            <div class="task-top-row">
              <div class="task-info">
                <span class="task-title">${isHousework ? '<span class="housework-badge">家务</span>' : ''}${(t.category === 'sleep' || sleepSteps.some(step => step.title === t.title)) ? '<span class="housework-badge" style="color:#c4b5fd;background:rgba(167,139,250,.15);">早睡</span>' : ''}${t.title}</span>
                <div class="task-meta">
                  <span>提醒：${new Date(t.targetTime).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>
                  ${t.isRepeat ? `<span>每 ${t.minutes < 1 ? `${Math.round(t.minutes * 60)} 秒` : `${t.minutes} 分钟`}提醒一次</span>` : ''}
                  ${t.isRepeat ? '<span class="repeat-badge">循环</span>' : ''}
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <span class="task-time-remaining">${formatRemainingTime(remaining)}</span>
                <button class="btn-delete" onclick="deleteTask('${t.id}')" title="取消提醒">✕</button>
              </div>
            </div>
            <div class="task-actions reminder-actions">
              <span class="reminder-actions-label">调整提醒:</span>
              <button type="button" class="btn-snooze reminder-edit" onclick="editReminderTime('${t.id}')">修改时间</button>
              <button type="button" class="btn-snooze reminder-plus5" onclick="snoozeTaskDirect('${t.id}', 5, true)">+5分</button>
              <button type="button" class="btn-snooze reminder-plus15" onclick="snoozeTaskDirect('${t.id}', 15, true)">+15分</button>
              <button type="button" class="btn-snooze reminder-complete" onclick="completeTask('${t.id}')" style="color:#2ed573; border-color:#2ed573;">已完成</button>
              <button type="button" class="btn-snooze reminder-minus5" onclick="advanceTaskTime('${t.id}', 5)">−5分</button>
              <button type="button" class="btn-snooze reminder-minus15" onclick="advanceTaskTime('${t.id}', 15)">−15分</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 全局主定时器（每秒更新 UI 并检查倒计时）
    function startGlobalTicker() {
      if (globalTicker) clearInterval(globalTicker);

      const tick = () => {
          const now = Date.now();
        let updated = false;

        tasks.forEach(t => {
          if (now >= t.targetTime && !t.ringingToken && currentRingingTaskId === null) {
            t.ringingToken = crypto.randomUUID();
            saveTasks();
            // 触发声音
            playSignatureSound();

            // 记录当前响铃任务并弹出追问弹窗
            document.getElementById('current-activity').value = '';
            currentRingingTaskId = t.id;
            document.getElementById('modal-task-title').innerText = `📢 ${t.title}`;
            document.getElementById('modal-task-sub').innerText = `提醒时间到！打算完成了还是再推迟一会儿？`;
            document.getElementById('snooze-modal').style.display = 'flex';

            // 通知失败不影响任务计时和网页提醒。
            void showTaskNotification(t);

            if (t.isRepeat) {
              // 重置循环倒计时
              t.targetTime = now + t.minutes * 60 * 1000;
            } else {
              // 单次任务推迟或延迟处理，不直接无声销毁
              t.targetTime = now + 60 * 1000; // 默认给1分钟缓冲
            }
            updated = true;
          }
        });

        if (updated) {
          saveTasks();
        }

        renderTasks();

        // 更新网页标题显示最近到期的任务时间
        if (tasks.length > 0) {
          const nearest = Math.min(...tasks.map(t => t.targetTime - now));
          document.title = `(${formatRemainingTime(nearest)}) 提醒闹钟`;
        }
      };
      globalTicker = setInterval(tick, 1000);
    }

    // 初始化运行
    window.onload = async function() {
      if ('caches' in window) {
        try {
          const pending = await caches.open('bark-pending-actions-v1');
          const actions = [];
          for (const key of await pending.keys()) {
            const response = await pending.match(key);
            actions.push({ key, ...await response.json() });
          }
          actions.sort((a, b) => a.time - b.time);
          for (const item of actions) {
            handleNotificationAction(item.taskId, item.action, item.time, item.token);
            await pending.delete(item.key);
          }
        } catch (error) {
          console.error('Pending notification actions unavailable:', error);
        }
      }
      const params = new URLSearchParams(location.search);
      const taskId = params.get('notificationTask');
      if (taskId) {
        handleNotificationAction(taskId, params.get('notificationAction') || 'open', Date.now(), params.get('notificationToken'));
        params.delete('notificationToken');
        params.delete('notificationTask');
        params.delete('notificationAction');
        history.replaceState(null, '', location.pathname + (params.size ? '?' + params : '') + location.hash);
      }
      renderTasks();
      renderCompletedTasks();
      renderActivityRecords();
      startGlobalTicker();
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>做了没？ · 把想做的，变成做完的</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#24252c;background:#f8f9fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;transition:background .15s,transform .15s}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible{outline:3px solid #c4baff;outline-offset:3px}button:disabled{cursor:default;opacity:.5}.page{max-width:850px;margin:auto;padding:48px 28px 32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;background:#7360d9;color:white;border-radius:12px;width:39px;height:39px;font-size:24px;font-weight:650}h1{font-size:25px;letter-spacing:-1px;margin:0}.tag{font-size:12px;color:#848590;border:1px solid #e3e4eb;border-radius:20px;padding:6px 11px}.intro h2{font-size:32px;letter-spacing:-1px;margin:0 0 12px}.intro p{font-size:14px;color:#7a7c89;margin:0 0 26px;line-height:1.8}.sound{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#f0edfb;border:1px solid #e6e0fa;padding:14px 17px;border-radius:12px;margin-bottom:24px}.sound p{flex:1;min-width:200px;margin:0;font-size:12px;line-height:1.7;color:#655b87}button{border:1px solid #e1e2e9;background:#fff;color:#555765;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:550}button:hover{background:#f3f2f8}.primary{background:#7460db;color:#fff;border-color:#7460db}.primary:hover{background:#6450c8}.card{background:#fff;border:1px solid #e6e7ed;border-radius:14px;box-shadow:0 3px 10px #24243c03}.create{padding:24px}h3{font-size:14px;margin:0 0 21px;font-weight:650}.form-grid{display:grid;grid-template-columns:1fr 230px auto;gap:12px;align-items:end}label{display:block;font-size:12px;color:#777986;margin-bottom:8px}input{width:100%;min-width:0;border:1px solid #e0e2e9;border-radius:8px;background:#fff;padding:11px 12px;font-size:14px;color:#363743;height:44px}input::placeholder{color:#a3a5b0}.form-grid button{height:44px;white-space:nowrap}.section-head{display:flex;justify-content:space-between;align-items:center;margin:33px 0 14px}.section-head h3{margin:0}.count{color:#999ba5;font-size:12px}.task-list{display:grid;gap:10px}.empty{text-align:center;padding:42px 15px;color:#999ba6;font-size:13px;line-height:1.9}.empty strong{display:block;color:#686a78;font-size:14px;font-weight:550}.task{display:flex;gap:14px;padding:19px 20px;align-items:center}.status-dot{width:19px;height:19px;border:2px solid #d7d2eb;border-radius:50%;flex-shrink:0}.task.done .status-dot{background:#e6f2eb;border-color:#e6f2eb;color:#448464;font-size:12px;text-align:center}.task-info{flex:1;min-width:0}.task-title{font-size:14px;font-weight:550;overflow-wrap:anywhere}.done .task-title{color:#999ba5;text-decoration:line-through}.meta{font-size:11px;color:#9295a1;margin-top:7px;line-height:1.6}.badge{font-size:11px;padding:4px 8px;border-radius:5px;background:#f3f1fb;color:#8171b4;white-space:nowrap}.badge.overdue{color:#be8353;background:#fff4e9}.badge.complete{color:#5c9576;background:#edf6f0}.delete{border:0;background:transparent;color:#a2a4af;font-size:12px;padding:8px}.delete:hover{color:#ba6262;background:#fff4f4}.stats{margin-top:28px;padding:23px;display:flex;align-items:center}.stats-title{font-size:12px;color:#8e909b;flex:1}.stat{flex:1;border-left:1px solid #eeeef3;text-align:center}.stat strong{display:block;font-size:23px;font-weight:600;margin-bottom:6px}.stat span{font-size:11px;color:#92949f}.stat:nth-child(3) strong{color:#6b9b80}footer{text-align:center;font-size:11px;line-height:1.8;color:#a4a6b0;margin-top:25px}.notice{font-size:12px;color:#a55e50;line-height:1.7;margin-top:12px}.overlay{position:fixed;inset:0;background:#24223755;backdrop-filter:blur(5px);display:grid;place-items:center;z-index:10;padding:20px}.overlay[hidden],[hidden]{display:none!important}.modal{background:#fff;border:1px solid #eeeaf9;border-radius:22px;padding:35px;width:min(440px,100%);box-shadow:0 25px 90px #211b3b33;text-align:center}.bell{width:52px;height:52px;border-radius:17px;background:#f0ebfd;color:#7960d6;display:grid;place-items:center;margin:0 auto 21px}.modal h2{font-size:28px;margin:0 0 13px;letter-spacing:-.6px}.modal .name{font-size:17px;line-height:1.6;overflow-wrap:anywhere;margin:0 0 11px}.modal .sub{font-size:12px;color:#9895a6;line-height:1.8;min-height:22px}.actions{display:flex;gap:10px;margin-top:25px}.actions button{flex:1;padding:12px}.snooze{display:flex;gap:8px;margin-top:20px}.snooze button{flex:1;padding:12px 6px}.quiet{border:0;background:transparent;color:#9994a7;margin-top:18px;font-size:12px}.queue{font-size:11px;color:#a09bab;margin-top:14px}.stop{color:#8b789e}.storage-warning{margin:12px 0 0}
@media(max-width:650px){.page{padding:27px 18px}header{margin-bottom:35px}.tag{display:none}.intro h2{font-size:27px}.form-grid{grid-template-columns:1fr}.create{padding:20px}.sound{gap:8px}.sound p{flex-basis:100%}.task{padding:16px 13px;gap:10px}.stats{padding:20px 10px}.stats-title{font-size:11px}.badge{font-size:10px}.modal{padding:28px 22px}.task{flex-wrap:wrap}.delete{padding:6px}.stat strong{font-size:21px}}
</style>
</head>
<body>
<main class="page">
<header><div class="brand"><span class="mark" aria-hidden="true">✓</span><h1>做了没？</h1></div><span class="tag">少一点拖延，多一点行动</span></header>
<section class="intro"><h2>这件事，今天就做。</h2><p>一个会主动响铃、追问你有没有完成任务的待办清单。</p></section>
<section class="sound" aria-label="声音设置"><p id="sound-status" role="status">请点击开启声音提醒，并保持网页打开。</p><button id="enable">开启声音提醒</button><button id="test">测试响铃</button></section>
<section class="card create"><h3>给自己一个行动的时间</h3><form id="form"><div class="form-grid"><div><label for="name">要做什么</label><input id="name" placeholder="例如：去健身" maxlength="120" required autocomplete="off"></div><div><label for="time">什么时候提醒</label><input id="time" type="datetime-local" required></div><button class="primary" type="submit">开始督促</button></div><div id="form-error" class="notice" role="status"></div></form></section>
<p id="storage-warning" class="notice storage-warning" role="alert" hidden></p>
<section aria-label="任务列表"><div class="section-head"><h3>我的任务</h3><span class="count" id="list-count"></span></div><div class="task-list" id="tasks"></div></section>
<section class="card stats" aria-label="今日任务统计"><div class="stats-title">今日概览</div><div class="stat"><strong id="total">0</strong><span>今日任务</span></div><div class="stat"><strong id="completed">0</strong><span>已完成</span></div><div class="stat"><strong id="pending">0</strong><span>未完成</span></div></section>
<footer>数据仅保存在当前浏览器 · 让每一个「等会儿」都有下文<br>请保持网页打开与电脑唤醒；后台提醒可能因浏览器节流而延迟。</footer>
</main>
<div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-name"><div class="bell" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4M12 2V1"/></svg></div><h2 id="dialog-title">做了没？</h2><p class="name" id="dialog-name"></p><p class="sub" id="dialog-sub"></p><div id="answer" class="actions"><button id="no">还没做</button><button id="yes" class="primary">做了</button></div><div id="snooze" hidden><div class="snooze"><button data-minutes="5">5 分钟后</button><button data-minutes="10">10 分钟后</button><button data-minutes="15">15 分钟后</button></div><button class="quiet" id="skip">今天跳过</button></div><button class="quiet stop" id="stop">停止铃声</button><p class="queue" id="queue"></p></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='zuolemei.tasks.v1';
let tasks=[], queue=[], active=null, audio=null, ringTimer=null, voices=new Set(), soundEnabled=false, mode='answer', previousFocus=null;
const day=timestamp=>{const d=new Date(timestamp);return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;};
const format=timestamp=>new Date(timestamp).toLocaleString('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
function storageError(message){$('storage-warning').hidden=false;$('storage-warning').textContent=message;}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw Error();const ids=new Set();tasks=parsed.filter(t=>t&&typeof t.id==='string'&&!ids.has(t.id)&&ids.add(t.id)&&typeof t.name==='string'&&Number.isFinite(t.nextAt)&&Number.isFinite(t.originalAt)&&['pending','done','skipped'].includes(t.status)).map(t=>({...t,name:t.name.slice(0,120),reminders:Number.isInteger(t.reminders)&&t.reminders>=0?t.reminders:0}));}}catch(e){storageError('无法读取本地任务数据。当前仍可使用，但请检查浏览器的本地存储设置。');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){storageError('保存失败：本地存储不可用或已满。当前改动仅在本次页面打开期间有效。');}}
function defaultTime(){const d=new Date(Date.now()+5*60000);d.setSeconds(0,0);$('time').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function render(){
 const list=$('tasks');list.replaceChildren();$('list-count').textContent=`${tasks.length} 项任务`;
 const sorted=[...tasks].sort((a,b)=>(a.status==='done')-(b.status==='done')||a.nextAt-b.nextAt);
 for(const t of sorted){const row=el('article',`card task ${t.status==='done'?'done':''}`);const dot=el('span','status-dot',t.status==='done'?'✓':'');dot.setAttribute('aria-hidden','true');const info=el('div','task-info');info.append(el('div','task-title',t.name));let meta=`${format(t.nextAt)} · 已提醒 ${t.reminders} 次`;if(t.status==='done')meta=`完成于 ${format(t.completedAt||t.nextAt)} · 已提醒 ${t.reminders} 次`;if(t.status==='skipped')meta=`今天暂停 · ${format(t.nextAt)} 再提醒`;info.append(el('div','meta',meta));const overdue=t.status==='pending'&&t.nextAt<=Date.now();const badge=el('span',`badge ${t.status==='done'?'complete':overdue?'overdue':''}`,t.status==='done'?'已完成':t.status==='skipped'?'今天跳过':active===t.id?'提醒中':overdue?'已逾期':'待提醒');const del=el('button','delete','删除');del.type='button';del.setAttribute('aria-label',`删除任务：${t.name}`);del.onclick=()=>removeTask(t.id);row.append(dot,info,badge,del);list.append(row);}
 if(!tasks.length){const empty=el('div','card empty');empty.append(el('strong','','还没有要督促的事'),document.createTextNode('从一件小事开始，给它安排一个时间。'));list.append(empty);}
 const today=day(Date.now());const todays=tasks.filter(t=>day(t.originalAt)===today||day(t.nextAt)===today||(t.completedAt&&day(t.completedAt)===today));const done=todays.filter(t=>t.status==='done').length;$('total').textContent=todays.length;$('completed').textContent=done;$('pending').textContent=todays.length-done;
}
function soundStatus(message){$('sound-status').textContent=message;}
async function enableSound(){try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)throw Error('unsupported');if(!audio||audio.state==='closed'){audio=new Context();audio.onstatechange=()=>{if(audio.state!=='running'&&soundEnabled)soundStatus('声音已暂停，请点击开启声音提醒恢复；弹窗提醒仍然可用。');};}await audio.resume();if(audio.state!=='running')throw Error('suspended');soundEnabled=true;$('enable').textContent='声音已开启';soundStatus('声音提醒已开启，请保持网页打开。');return true;}catch(e){soundEnabled=false;$('enable').textContent='开启声音提醒';soundStatus('暂时无法播放声音，仍会显示提醒弹窗。可再次点击开启声音提醒。');return false;}}
function stopRing(){clearInterval(ringTimer);ringTimer=null;for(const voice of voices){try{voice.stop();}catch(e){}}voices.clear();}
function chime(){if(!audio||audio.state!=='running'){soundStatus('声音未开启或已暂停，当前使用弹窗提醒。点击开启声音提醒可恢复。');return;}try{[0,.24,.48].forEach((delay,i)=>{const oscillator=audio.createOscillator(),gain=audio.createGain(),start=audio.currentTime+delay;oscillator.type='sine';oscillator.frequency.value=[659.25,830.61,987.77][i];gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.09,start+.025);gain.gain.exponentialRampToValueAtTime(.001,start+.35);oscillator.connect(gain);gain.connect(audio.destination);voices.add(oscillator);oscillator.onended=()=>{voices.delete(oscillator);oscillator.disconnect();gain.disconnect();};oscillator.start(start);oscillator.stop(start+.38);});}catch(e){stopRing();soundStatus('声音播放失败，弹窗提醒仍然可用。');}}
function startRing(){stopRing();$('stop').textContent='停止铃声';if(!soundEnabled){soundStatus('声音尚未开启，当前使用弹窗提醒。');return;}if(audio&&audio.state==='suspended')audio.resume().then(()=>{if(active&&ringTimer)chime();}).catch(()=>soundStatus('声音无法恢复，当前使用弹窗提醒。'));chime();ringTimer=setInterval(chime,1800);}
function updateQueueLabel(){$('queue').textContent=queue.length?`还有 ${queue.length} 项任务等待提醒`:'一次只督促一件事';}
function openModal(test=false){previousFocus=document.activeElement;mode='answer';$('overlay').hidden=false;$('answer').hidden=false;$('snooze').hidden=true;$('yes').textContent=test?'结束测试':'做了';$('no').hidden=test;$('dialog-title').textContent=test?'提醒测试':'做了没？';const t=tasks.find(t=>t.id===active);$('dialog-name').textContent=test?'这是你的行动提醒铃声':t.name;$('dialog-sub').textContent=test?'听到铃声后，点击停止铃声或结束测试。':t.reminders>1?'你上次说还没做，现在做了没？':'时间到了，完成后就可以安心划掉它。';updateQueueLabel();$('yes').focus();startRing();}
function closeModal(){stopRing();active=null;$('overlay').hidden=true;if(previousFocus&&previousFocus.isConnected)previousFocus.focus();}
function showNext(){if(active)return;while(queue.length){const id=queue.shift();const t=tasks.find(t=>t.id===id&&t.status==='pending'&&t.nextAt<=Date.now());if(!t)continue;active=id;t.reminders++;save();openModal();render();return;}updateQueueLabel();}
// Rebuild from absolute timestamps: delayed background timers never lose a due task.
function checkDue(){const now=Date.now();let changed=false;for(const t of tasks){if(t.status==='skipped'&&t.nextAt<=now){t.status='pending';changed=true;}}if(changed)save();const waiting=tasks.filter(t=>t.status==='pending'&&t.nextAt<=now&&t.id!==active).sort((a,b)=>a.nextAt-b.nextAt);queue=waiting.map(t=>t.id);updateQueueLabel();showNext();render();}
function removeTask(id){tasks=tasks.filter(t=>t.id!==id);queue=queue.filter(x=>x!==id);if(active===id)closeModal();save();checkDue();}
function finish(){if(active==='test'){closeModal();checkDue();return;}const t=tasks.find(t=>t.id===active);if(t){t.status='done';t.completedAt=Date.now();save();}closeModal();checkDue();}
function postpone(minutes){const t=tasks.find(t=>t.id===active);if(!t)return;if(minutes===null){const tomorrow=new Date();tomorrow.setHours(24,0,0,0);t.nextAt=tomorrow.getTime();t.status='skipped';}else{t.nextAt=Date.now()+minutes*60000;t.status='pending';}save();closeModal();checkDue();}
$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),nextAt=new Date($('time').value).getTime();if(!name||!Number.isFinite(nextAt)){$('form-error').textContent='请填写任务名称和有效的提醒时间。';return;}$('form-error').textContent='';tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,nextAt,originalAt:nextAt,status:'pending',reminders:0,completedAt:null});save();$('name').value='';defaultTime();checkDue();};
$('enable').onclick=async()=>{const ok=await enableSound();if(ok&&active&&mode==='answer')startRing();};
$('test').onclick=async()=>{if(active)return;$('test').disabled=true;await enableSound();$('test').disabled=false;if(active)return;active='test';openModal(true);};
$('stop').onclick=()=>{stopRing();$('stop').textContent='铃声已停止';};$('yes').onclick=finish;
$('no').onclick=()=>{stopRing();mode='snooze';$('answer').hidden=true;$('snooze').hidden=false;$('dialog-title').textContent='那几分钟后再提醒你？';$('dialog-sub').textContent='没关系，给自己一点时间，再开始。';$('stop').textContent='铃声已停止';$('snooze').querySelector('button').focus();};
document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>postpone(Number(b.dataset.minutes)));$('skip').onclick=()=>postpone(null);
$('overlay').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();stopRing();$('stop').textContent='铃声已停止';}if(e.key==='Tab'){const buttons=[...$('overlay').querySelectorAll('button')].filter(b=>b.getClientRects().length&&!b.disabled);const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('visibilitychange',checkDue);window.addEventListener('focus',checkDue);window.addEventListener('pageshow',checkDue);window.addEventListener('pagehide',stopRing);
defaultTime();checkDue();setInterval(checkDue,1000);
</script>
</body>
</html>

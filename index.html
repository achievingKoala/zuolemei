<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bark Reminder - 极简声音唤醒工具</title>
  <style>
    /* 采用 levelsio 标志性的极客极简黑白高对比度风格 */
    :root {
      --bg: #111111;
      --card-bg: #1a1a1a;
      --border: #333333;
      --text: #ffffff;
      --text-dim: #888888;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .time-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-time {
      padding: 10px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-time.active, .btn-time:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .sound-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .repeat-option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #000;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .repeat-option input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-preview {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-preview:hover {
      color: #fff;
      border-color: #fff;
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-start:hover {
      background: var(--accent-hover);
    }

    /* Active Tasks List UI */
    .active-tasks-section {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .task-card {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-snooze {
      background: #222;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-snooze:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .task-meta {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .repeat-badge {
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .task-time-remaining {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: var(--accent);
    }

    /* Monetization Hook */
    .pro-banner {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .pro-link {
      color: #ffb142;
      text-decoration: none;
      font-weight: 600;
    }

    .pro-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📢 Bark Reminder</h1>
      <p class="subtitle">只用声音，强行唤醒你的执行力</p>
    </header>

    <!-- 设置表单 -->
    <div id="setup-form">
      <div class="form-group">
        <label for="task-input">提醒事项</label>
        <input type="text" id="task-input" placeholder="例如：站起来喝水 / 关电脑" value="站起来活动一下！">
      </div>

      <div class="form-group">
        <label>多久后提醒？</label>
        <div class="time-options">
          <button class="btn-time active" onclick="selectTime(5, this)">5分钟</button>
          <button class="btn-time" onclick="selectTime(15, this)">15分钟</button>
          <button class="btn-time" onclick="selectTime(25, this)">25分钟</button>
          <button class="btn-time" onclick="selectTime(45, this)">45分钟</button>
        </div>
      </div>

      <div class="form-group">
        <label>循环设置</label>
        <label class="repeat-option">
          <input type="checkbox" id="repeat-checkbox">
          <span>每天 / 到期后自动循环提醒</span>
        </label>
      </div>

      <div class="form-group">
        <label>提醒声音</label>
        <div class="sound-badge">
          <div class="sound-info">
            <span>🚨</span>
            <strong>高穿透脉冲警报 (默认)</strong>
          </div>
          <button class="btn-preview" onclick="playSignatureSound()">试听</button>
        </div>
      </div>

      <button class="btn-start" onclick="addTask()">添加声音提醒</button>
    </div>

    <!-- 运行中的多任务列表 UI -->
    <div class="active-tasks-section">
      <div class="section-title">进行中的提醒 (<span id="task-count">0</span>)</div>
      <div id="tasks-list">
        <!-- 任务卡片会动态插入到这里 -->
      </div>
    </div>

    <!-- 追问与声音提示弹窗 -->
    <div id="snooze-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; justify-content:center; align-items:center; padding:20px;">
      <div style="background:var(--card-bg); border:1px solid var(--accent); border-radius:12px; padding:24px; max-width:400px; width:100%; text-align:center;">
        <h2 style="font-size:1.3rem; margin-bottom:8px;" id="modal-task-title">时间到了！</h2>
        <p style="color:var(--text-dim); font-size:0.9rem; margin-bottom:20px;" id="modal-task-sub">完成了吗？或者选择稍后提醒：</p>
        
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px;">
          <button class="btn-time" onclick="snoozeActiveTask(5)">+5分钟</button>
          <button class="btn-time" onclick="snoozeActiveTask(10)">+10分钟</button>
          <button class="btn-time" onclick="snoozeActiveTask(15)">+15分钟</button>
        </div>

        <button class="btn-start" onclick="completeActiveTask()" style="background:#2ed573;">完成了！(关闭)</button>
      </div>
    </div>

    <!-- levelsio 式变现/打赏入口 -->
    <div class="pro-banner">
      <span>想要暴躁老哥语音或 AI 语音定制？</span>
      <a href="#" class="pro-link" onclick="alert('即将推出 Pro 版 ($3/月)！包括 AI 语音喊话、自定义音频上传等功能。'); return false;">解锁 Pro ⚡</a>
    </div>
  </div>

  <script>
    let selectedMinutes = 5;
    let tasks = JSON.parse(localStorage.getItem('bark_tasks') || '[]');
    let globalTicker = null;
    let currentRingingTaskId = null;

    // 选择预设时间
    function selectTime(mins, btnElement) {
      selectedMinutes = mins;
      document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
    }

    // Web Audio API 高穿透力音效
    function playSignatureSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        [0, 0.2, 0.4].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, ctx.currentTime + delay);
          osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + delay + 0.15);

          gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.15);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.15);
        });
      } catch (e) {
        console.error("Audio playback error:", e);
      }
    }

    // 添加新任务
    function addTask() {
      const input = document.getElementById('task-input');
      const title = input.value.trim() || '未命名提醒';
      const isRepeat = document.getElementById('repeat-checkbox').checked;

      const newTask = {
        id: 'task_' + Date.now(),
        title: title,
        minutes: selectedMinutes,
        isRepeat: isRepeat,
        targetTime: Date.now() + selectedMinutes * 60 * 1000
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();

      // 请求系统通知权限
      if (window.Notification && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    // 快捷稍后提醒 (从卡片直接推迟)
    function snoozeTaskDirect(id, extraMinutes) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.targetTime = Date.now() + extraMinutes * 60 * 1000;
        saveTasks();
        renderTasks();
      }
    }

    // 弹窗触发稍后提醒
    function snoozeActiveTask(extraMinutes) {
      if (currentRingingTaskId) {
        snoozeTaskDirect(currentRingingTaskId, extraMinutes);
        closeModal();
      }
    }

    // 完成/关闭当前弹窗任务
    function completeActiveTask() {
      if (currentRingingTaskId) {
        const task = tasks.find(t => t.id === currentRingingTaskId);
        if (task && !task.isRepeat) {
          tasks = tasks.filter(t => t.id !== currentRingingTaskId);
        }
        saveTasks();
        renderTasks();
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('snooze-modal').style.display = 'none';
      currentRingingTaskId = null;
    }

    // 删除任务
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    // 持久化存储
    function saveTasks() {
      localStorage.setItem('bark_tasks', JSON.stringify(tasks));
    }

    // 格式化剩余时间
    function formatRemainingTime(ms) {
      if (ms <= 0) return "00:00";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 渲染任务列表与轮询检查
    function renderTasks() {
      const listContainer = document.getElementById('tasks-list');
      document.getElementById('task-count').innerText = tasks.length;

      if (tasks.length === 0) {
        listContainer.innerHTML = `<p style="color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 12px 0;">暂无运行中的提醒，添加一个吧！</p>`;
        document.title = 'Bark Reminder - 极简声音唤醒工具';
        return;
      }

      listContainer.innerHTML = tasks.map(t => {
        const remaining = t.targetTime - Date.now();
        return `
          <div class="task-card">
            <div class="task-top-row">
              <div class="task-info">
                <span class="task-title">${t.title}</span>
                <div class="task-meta">
                  <span>每 ${t.minutes} 分钟</span>
                  ${t.isRepeat ? '<span class="repeat-badge">循环</span>' : ''}
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <span class="task-time-remaining">${formatRemainingTime(remaining)}</span>
                <button class="btn-delete" onclick="deleteTask('${t.id}')" title="取消提醒">✕</button>
              </div>
            </div>
            <div class="task-actions" style="border-top: 1px solid #222; padding-top: 8px; justify-content: flex-end;">
              <span style="font-size: 0.75rem; color: var(--text-dim); margin-right: auto;">稍后提醒:</span>
              <button class="btn-snooze" onclick="snoozeTaskDirect('${t.id}', 5)">+5分</button>
              <button class="btn-snooze" onclick="snoozeTaskDirect('${t.id}', 15)">+15分</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 全局主定时器（每秒更新 UI 并检查倒计时）
    function startGlobalTicker() {
      if (globalTicker) clearInterval(globalTicker);

      globalTicker = setInterval(() => {
        const now = Date.now();
        let updated = false;

        tasks.forEach(t => {
          if (now >= t.targetTime) {
            // 触发声音
            playSignatureSound();

            // 记录当前响铃任务并弹出追问弹窗
            currentRingingTaskId = t.id;
            document.getElementById('modal-task-title').innerText = `📢 ${t.title}`;
            document.getElementById('modal-task-sub').innerText = `提醒时间到！打算完成了还是再推迟一会儿？`;
            document.getElementById('snooze-modal').style.display = 'flex';

            // 触发系统通知
            if (window.Notification && Notification.permission === 'granted') {
              new Notification('📢 Bark Reminder 时间到！', { body: t.title });
            }

            if (t.isRepeat) {
              // 重置循环倒计时
              t.targetTime = now + t.minutes * 60 * 1000;
            } else {
              // 单次任务推迟或延迟处理，不直接无声销毁
              t.targetTime = now + 60 * 1000; // 默认给1分钟缓冲
            }
            updated = true;
          }
        });

        if (updated) {
          saveTasks();
        }

        renderTasks();

        // 更新网页标题显示最近到期的任务时间
        if (tasks.length > 0) {
          const nearest = Math.min(...tasks.map(t => t.targetTime - now));
          document.title = `(${formatRemainingTime(nearest)}) Bark Reminder`;
        }
      }, 1000);
    }

    // 初始化运行
    window.onload = function() {
      renderTasks();
      startGlobalTicker();
    };
  </script>
</body>
</html>

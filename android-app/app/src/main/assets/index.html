<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>做了没</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:16px system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:28px 20px 48px}h1{font-size:30px;margin:0 0 8px}h2{font-size:18px;margin-top:28px}.muted{color:#aaa;font-size:13px;line-height:1.6}label{display:block;margin:24px 0 10px;color:#bbb;font-size:14px}input,button,textarea{font:inherit;border-radius:10px;border:1px solid #393939;padding:13px;background:#1b1b1b;color:white}input,textarea{width:100%}input:focus,textarea:focus{outline:1px solid #ff4757}button{cursor:pointer}button:disabled{opacity:.5}.primary{width:100%;background:#ff4757;border-color:#ff4757;margin-top:18px;font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;white-space:nowrap}.row button.active{border-color:#ff4757;color:#ff7b86}.card,.permissions{background:#191919;border:1px solid #333;border-radius:12px;padding:16px;margin:12px 0}.card strong{display:block;overflow-wrap:anywhere;margin-bottom:7px}.card .row{margin-top:12px}.card button{padding:9px;font-size:13px}.permissions button{font-size:13px;padding:8px;margin:4px 4px 0 0}#notice{min-height:24px;color:#ffb2b8;font-size:14px;margin-top:12px}dialog{background:#191919;color:#fff;border:1px solid #555;border-radius:16px;width:calc(100% - 32px);max-width:460px}dialog::backdrop{background:#000b}dialog h2{margin-top:8px}
</style></head><body><main>
<h1>做了没</h1><div class="muted">给下一件事，设一个提醒。</div>
<div id="permissions" class="permissions"></div>
<label for="title">提醒事项</label><input id="title" list="history-options" maxlength="200" autocomplete="off" placeholder="输入新事项，或选择已做过的事项"><datalist id="history-options"></datalist>
<label>多久后提醒？</label><div class="row" id="minutes"><button data-min="5" class="active">5分钟</button><button data-min="15">15分钟</button><button data-min="25">25分钟</button><button data-min="45">45分钟</button></div>
<label for="custom">自定义分钟数</label><input id="custom" type="number" min="1" max="10080" inputmode="numeric" placeholder="例如：60">
<button id="add" class="primary">添加声音提醒</button><div id="notice" role="status" aria-live="polite"></div>
<h2>待办提醒 <span id="count"></span></h2><div id="tasks"></div>
<h2>已完成记录 <span id="history-count"></span></h2><div id="history"></div>
<p class="muted">首次使用请把闹钟音量调高。系统强行停止应用、关机或关闭权限会影响提醒。锁屏全屏显示取决于系统设置。网页旧记录不会自动转入 App。</p>
<dialog id="activity-dialog"><h2>完成这件事</h2><textarea id="activity" placeholder="你现在正在做什么？（可留空）"></textarea><button class="primary" id="confirm-complete">确认完成</button><button id="cancel-complete" style="margin-top:10px;width:100%">返回</button></dialog>
</main><script>
let selected=5,state={tasks:[],history:[]},viewKey='',completing='';
const $=id=>document.getElementById(id);
function text(tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el}
function button(label,fn){const el=text('button',label);el.onclick=fn;return el}
function notice(message){$('notice').textContent=message}
function run(fn){try{const error=fn();if(error){notice(error);return false}viewKey='';refresh();return true}catch(e){notice('操作失败，请重新打开应用后重试。');return false}}
function refresh(){
 try{state=JSON.parse(AlarmApp.state());if(state.error){notice(state.error);return}}catch(e){notice('应用连接失败，请重新打开。');return}
 const key=JSON.stringify(state);if(key!==viewKey){viewKey=key;render()}
 document.querySelectorAll('[data-time]').forEach(el=>{const delta=Math.max(0,Math.ceil((Number(el.dataset.time)-Date.now())/1000));el.textContent=delta?Math.floor(delta/60)+'分'+delta%60+'秒后提醒':'等待系统触发';});
}
function render(){
 const p=$('permissions');p.replaceChildren();
 if(!state.exactAllowed || !state.notificationsAllowed || !state.fullScreenAllowed){
  p.append(text('div','设置提醒权限','muted'));
  if(!state.notificationsAllowed)p.append(button('开启通知',()=>AlarmApp.permissions('notification')));
  if(!state.exactAllowed)p.append(button('开启闹钟和提醒',()=>AlarmApp.permissions('exact')));
  if(!state.fullScreenAllowed)p.append(button('开启锁屏全屏提醒',()=>AlarmApp.permissions('fullscreen')));
 }else p.append(text('div','提醒权限已开启，请检查手机闹钟音量。','muted'));
 $('count').textContent='('+state.tasks.length+')';$('tasks').replaceChildren();
 if(!state.tasks.length)$('tasks').append(text('p','还没有待办提醒。','muted'));
 state.tasks.slice().sort((a,b)=>a.targetTime-b.targetTime).forEach(t=>{
  const card=text('div','','card');card.append(text('strong',t.title));
  const time=text('div',t.status==='missed'?'已响铃5分钟，尚未完成':t.status==='ringing'?'正在响铃':'','muted');
  if(t.status==='scheduled')time.dataset.time=t.targetTime;card.append(time);
  card.append(text('div',new Date(t.targetTime).toLocaleString('zh-CN')+' · 已推迟 '+t.snoozeCount+' 次','muted'));
  const row=text('div','','row');row.append(button('完成',()=>{completing=t.id;$('activity').value='';$('activity-dialog').showModal()}),button('+5分钟',()=>run(()=>AlarmApp.action(t.id,5,''))),button('+15分钟',()=>run(()=>AlarmApp.action(t.id,15,''))),button('删除',()=>{if(confirm('删除“'+t.title+'”？'))run(()=>AlarmApp.remove(t.id))}));card.append(row);$('tasks').append(card);
 });
 const history=state.history.slice().reverse();$('history-count').textContent='('+history.length+')';$('history').replaceChildren();$('history-options').replaceChildren();
 const seen=new Set();history.forEach(t=>{if(!seen.has(t.title)){seen.add(t.title);const option=document.createElement('option');option.value=t.title;$('history-options').append(option)}});
 if(!history.length)$('history').append(text('p','完成提醒后会显示在这里。','muted'));
 history.forEach(t=>{const card=text('div','','card');card.append(text('strong',t.title),text('div',new Date(t.completedAt).toLocaleString('zh-CN'),'muted'));if(t.activity)card.append(text('p','当时正在做：'+t.activity,'muted'));$('history').append(card)});
}
$('minutes').onclick=e=>{if(!e.target.dataset.min)return;selected=Number(e.target.dataset.min);$('custom').value='';document.querySelectorAll('[data-min]').forEach(el=>el.classList.toggle('active',Number(el.dataset.min)===selected))};
$('custom').oninput=()=>document.querySelectorAll('[data-min]').forEach(el=>el.classList.toggle('active',!$('custom').value&&Number(el.dataset.min)===selected));
$('add').onclick=()=>{const minutes=$('custom').value?Number($('custom').value):selected;if(!Number.isInteger(minutes)||minutes<1||minutes>10080){notice('请输入1至10080之间的整数分钟。');return}if(run(()=>AlarmApp.add($('title').value,minutes))){notice('提醒已设置');$('title').value=''}};
$('confirm-complete').onclick=()=>{if(run(()=>AlarmApp.action(completing,0,$('activity').value))){$('activity-dialog').close();notice('已完成')}};
$('cancel-complete').onclick=()=>$('activity-dialog').close();
window.addEventListener('focus',refresh);refresh();setInterval(refresh,1000);
</script></body></html>
